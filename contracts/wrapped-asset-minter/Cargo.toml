[package]
name = "wrapped-asset-minter"
description = "A cargo-generate template for Rust + Sway integration testing."
version = "0.1.0"
edition = "2021"
authors = ["PraneshASP <praneshas2000@gmail.com>"]
license = "Apache-2.0"

[dev-dependencies]
fuels = "0.66.0"
tokio = { version = "1.12", features = ["rt", "macros"] }
fuel-asm = "0.60.0"
fuel-tx = "0.60.0"
anyhow = "1.0"
sha2="0.10.8"

[[test]]
harness = true
name = "minter_tests"
path = "tests/harness.rs"
